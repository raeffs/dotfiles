# RX 7900 XTX and its HDMI/DP audio function belong to the win11 VM.
# Binding is by device ID: the iGPU also uses amdgpu, so amdgpu cannot be blacklisted.
# disable_idle_d3: without it vfio-pci lets the unused card go to D3cold. Navi 31
# does not wake from D3cold ("Unable to change power state from D3cold to D0,
# device inaccessible") and stays off the bus until the host is powered off.
options vfio-pci ids=1002:744c,1002:ab30 disable_idle_d3=1
softdep amdgpu pre: vfio-pci
softdep snd_hda_intel pre: vfio-pci
